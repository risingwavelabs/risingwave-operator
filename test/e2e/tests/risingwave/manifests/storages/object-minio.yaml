apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: ${E2E_NAMESPACE}
  labels:
    app: minio
spec:
  ports:
  - port: 9301
    name: service
  - port: 9400
    name: console
  selector:
    app: minio
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: ${E2E_NAMESPACE}
stringData:
  username: hummockadmin
  password: hummockadmin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: minio
  name: minio
  namespace: ${E2E_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  serviceName: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: minio
        image: cgr.dev/chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        args:
        - -ec
        - mkdir -p /data/hummock001; exec /usr/bin/minio server --address 0.0.0.0:9301 --console-address 0.0.0.0:9400 /data
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ "ALL" ]
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: service
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: username
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: password
        volumeMounts:
        - mountPath: /data
          name: minio-data
        ports:
        - name: service
          containerPort: 9301
          protocol: TCP
        - name: console
          containerPort: 9400
          protocol: TCP
      volumes:
      - name: minio-data
        emptyDir: {}
---
apiVersion: risingwave.risingwavelabs.com/v1alpha1
kind: RisingWave
metadata:
  name: ${E2E_RISINGWAVE_NAME}
  namespace: ${E2E_NAMESPACE}
spec:
  image: ${E2E_RISINGWAVE_IMAGE}
  components:
    meta:
      nodeGroups:
      - replicas: 1
        name: ''
    compactor:
      nodeGroups:
      - replicas: 1
        name: ''
    frontend:
      nodeGroups:
      - replicas: 1
        name: ''
    compute:
      nodeGroups:
      - replicas: 1
        name: ''
  metaStore:
    memory: true
  stateStore:
    minio:
      endpoint: minio:9301
      bucket: hummock001
      credentials:
        secretName: minio-credentials